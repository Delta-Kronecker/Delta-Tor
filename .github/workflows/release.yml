name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, e.g. v2.0.0 (workflow_dispatch only; blank on tag push)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform, build-tools and NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Create or update release tag
        # Manual runs build from the branch HEAD; point the tag input there.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force --tags
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "$TAG" --force

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore-release.jks
          ls -l keystore-release.jks

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/keystore-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_STORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_STORE_TYPE }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          echo "Using apksigner: $APKSIGNER"
          cp app/build/outputs/apk/release/app-release.apk "deltator-${{ inputs.tag != '' && inputs.tag || github.ref_name }}.apk"
          "$APKSIGNER" verify --verbose --print-certs "deltator-${{ inputs.tag != '' && inputs.tag || github.ref_name }}.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: deltator-release-apk
          path: deltator-${{ inputs.tag != '' && inputs.tag || github.ref_name }}.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          files: deltator-${{ inputs.tag != '' && inputs.tag || github.ref_name }}.apk
          generate_release_notes: true