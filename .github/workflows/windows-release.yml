name: Release Windows

# Windows half of the single-release model: the same tag also triggers
# release.yml (Android), so one GitHub release carries both platforms' assets
# and ReleaseChecker keeps a single endpoint.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, e.g. v2.1.0 (workflow_dispatch only; blank on tag push)'
        required: false
        default: ''
      allow_retag:
        description: 'Move the tag if it already points at a different commit. Off by default: repointing a published tag breaks rebuilds of what people already downloaded.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The native tunnel DLL must exist before dotnet build copies it.
      - name: Set up MSYS2 (native tunnel toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: gcc make curl

      - name: Build hev-socks5-tunnel.dll
        shell: msys2 {0}
        run: ./Windows/native/build-hev.sh

      # Same gate as windows-build.yml: the tunnel DLL must load in a
      # foreign (non-MSYS) host process, or users hit 0x8007045A
      # (ERROR_DLL_INIT_FAILED) at the first P/Invoke.
      - name: Smoke-test the tunnel DLL loads in a plain Win32 host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Namespace DeltaTorCI -Name Loader -MemberDefinition @'
          [System.Runtime.InteropServices.DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
          public static extern IntPtr LoadLibraryExW(string path, System.IntPtr reserved, uint flags);
          [System.Runtime.InteropServices.DllImport("kernel32.dll")]
          public static extern bool FreeLibrary(System.IntPtr handle);
          '@
          $dll = (Resolve-Path "Windows/src/DeltaTor.App/bin/Release/net8.0-windows/hev-socks5-tunnel.dll").Path
          # 0x8 = LOAD_WITH_ALTERED_SEARCH_PATH: dependencies (msys-2.0.dll)
          # resolve next to the DLL, exactly like DeltaTor.exe's own directory.
          $handle = [DeltaTorCI.Loader]::LoadLibraryExW($dll, [IntPtr]::Zero, 0x8)
          if ($handle -eq [IntPtr]::Zero) {
            $err = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
            Write-Host "::error::hev-socks5-tunnel.dll cannot load in a plain Win32 host (Win32 error $err, 1114=ERROR_DLL_INIT_FAILED)"
            exit 1
          }
          Write-Host "hev-socks5-tunnel.dll loaded into a plain host: $handle"
          [void][DeltaTorCI.Loader]::FreeLibrary($handle)

      - name: Resolve the tag, and refuse to move one that already exists
        # Verbatim from release.yml (same guard, same reasoning): a tag is a
        # promise about what people downloaded; an existing tag is only reused
        # when it already points at this commit, and moving one needs opt-in.
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          ALLOW_RETAG: ${{ inputs.allow_retag || 'false' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force --tags

          # On workflow_dispatch GITHUB_REF_NAME is the branch, not a tag, so
          # falling back to it blindly would happily create and push a release
          # tag named after the branch. Only trust it when the ref really is a tag.
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            echo "::error::no tag given, and this run is not a tag push."
            echo "::error::re-dispatch with a tag input such as v2.1.0, or push a v* tag."
            exit 1
          fi

          # Check the shape before the tag is pushed. A tag is permanent and
          # public, so "create it and let a later step complain" is the wrong
          # order: it leaves a junk tag behind for every bad input.
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH, e.g. v2.1.0"; exit 1 ;;
          esac

          # Peel both sides to commits before comparing (annotated tags make
          # the raw SHAs differ even when the tag is already correct).
          EXISTING_COMMIT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)"
          THIS_COMMIT="$(git rev-parse -q --verify "$GITHUB_SHA^{commit}" || true)"
          if [ -n "$EXISTING_COMMIT" ]; then
            if [ "$EXISTING_COMMIT" = "$THIS_COMMIT" ]; then
              echo "Tag $TAG already points at this commit; reusing it as-is."
            elif [ "$ALLOW_RETAG" = "true" ]; then
              echo "::warning::repointing $TAG from $EXISTING_COMMIT to $THIS_COMMIT (allow_retag)"
              git tag -f "$TAG" "$GITHUB_SHA"
              git push origin "$TAG" --force
            else
              echo "::error::tag $TAG already exists on $EXISTING_COMMIT, and this run is $THIS_COMMIT."
              echo "::error::re-running a published tag would make existing downloads irreproducible."
              echo "::error::tag a new version instead, or re-dispatch with allow_retag=true if you really mean it."
              exit 1
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Work out the version from the tag
        # One source of truth: the tag. The exe's own FileVersion is derived
        # from this (-p:Version), and the check below fails the release if the
        # two ever disagree, so a mis-tagged build cannot ship.
        id: version
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$TAG' is not MAJOR.MINOR.PATCH, e.g. v2.1.0"; exit 1 ;;
          esac
          echo "Building $TAG as version $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode the code-signing certificate
        # An empty secret here would decode into a 0-byte pfx and surface much
        # later as an opaque signtool complaint. Fail here, where the reason
        # is still obvious — and open the pfx with the password now, so a
        # password that does not match the cert also fails here.
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            Write-Host "::error::secret WINDOWS_CERT_BASE64 or WINDOWS_CERT_PASSWORD is empty; the release cannot be signed"
            exit 1
          }
          [IO.File]::WriteAllBytes("signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64.Trim()))
          if ((Get-Item signing.pfx).Length -eq 0) {
            Write-Host "::error::certificate decoded to an empty file"
            exit 1
          }
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
            "signing.pfx", $env:WINDOWS_CERT_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
          Write-Host "Certificate opens: subject=$($cert.Subject), thumbprint=$($cert.Thumbprint)"

      - name: Fetch pinned official binaries (Tor Expert Bundle 15.0.24 + wintun)
        run: ./Windows/fetch-binaries.ps1 -CI

      - name: Build signed release app
        # The exe version comes from the tag-derived property; the check below
        # proves the property actually reached the version resource.
        run: >
          dotnet build Windows/DeltaTor.sln -c Release --nologo
          -p:Version=${{ steps.version.outputs.version }}

      - name: Sign the binaries we build
        # Only our own artifacts are signed: overwriting the signatures on
        # tor.exe / lyrebird.exe / wintun.dll / msys-2.0.dll would erase the
        # upstream authors' signatures, which users and mirrors verify.
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $appDir = "Windows/src/DeltaTor.App/bin/Release/net8.0-windows"
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            Write-Host "::error::no signtool.exe found; cannot sign"
            exit 1
          }
          $files = @("$appDir\DeltaTor.exe", "$appDir\hev-socks5-tunnel.dll")
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { Write-Host "::error::cannot sign missing file $f"; exit 1 }
          }
          & $signtool.FullName sign /f signing.pfx /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 @files
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::signtool failed (exit $LASTEXITCODE)"
            exit 1
          }
          & $signtool.FullName verify /pa $files[0]
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::signature verification failed"
            exit 1
          }

      - name: Check the exe version matches the tag
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "Windows/src/DeltaTor.App/bin/Release/net8.0-windows/DeltaTor.exe"
          $vi = (Get-Item $exe).VersionInfo
          $fv = "$($vi.FileVersion)"
          $tri = (($fv -split '\.') | Select-Object -First 3) -join '.'
          Write-Host "$exe FileVersion=$fv ProductVersion=$($vi.ProductVersion)"
          if ($tri -ne $env:EXPECTED_VERSION) {
            Write-Host "::error::FileVersion $fv reports $tri but the tag says $($env:EXPECTED_VERSION)"
            Write-Host "::error::a build that ignored -p:Version would ship under the wrong version."
            exit 1
          }

      - name: Verify the binaries are signed by the expected certificate
        # Same fail-closed philosophy as Android's pin check: signtool verify
        # only proves *a* signature; the pin proves *whose*. The expected
        # SHA-256 (DER) lives in Windows/release-signing-cert.sha256; the
        # digest of the shipped exe is printed into the step summary when the
        # file has no pin yet, so the first real signing run fills it in.
        shell: pwsh
        env:
          PIN_FILE: Windows/release-signing-cert.sha256
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "Windows/src/DeltaTor.App/bin/Release/net8.0-windows/DeltaTor.exe"
          $sig = Get-AuthenticodeSignature -FilePath $exe
          if (-not $sig.SignerCertificate) {
            Write-Host "::error::$exe has no signer certificate"
            exit 1
          }
          $actual = $sig.SignerCertificate.GetCertHashString([System.Security.Cryptography.HashAlgorithmName]::SHA256).ToLowerInvariant()
          Write-Host "$exe signed by $actual (subject $($sig.SignerCertificate.Subject))"

          # First 64-hex run in the pin file; comments/CRLF/BOM/colons are
          # tolerated, exactly like the Android pin extraction.
          $pin = ''
          if (Test-Path $env:PIN_FILE) {
            $text = [IO.File]::ReadAllText($env:PIN_FILE)
            $text = $text -replace "^\xEF\xBB\xBF", ''
            $line = ($text -split "`n" | Where-Object { $_ -notmatch '^\s*#' } | Select-Object -First 1)
            if ($line) {
              $hex = ($line -replace '[^0-9a-fA-F]', '')
              if ($hex.Length -ge 64) { $pin = $hex.Substring(0, 64).ToLowerInvariant() }
            }
          }

          if (-not $pin) {
            "## Signing certificate not pinned yet" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "Put the digest below into $($env:PIN_FILE) on one line (colons optional), then rerun. The release was not published." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "- $actual" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Write-Host "::error::$($env:PIN_FILE) has no 64-character SHA-256 fingerprint on a single line, so signer identity is NOT verified."
            exit 1
          }

          if ($actual -ne $pin) {
            Write-Host "::error::signed by $actual but the repo pins $pin"
            Write-Host "::error::if the key was rotated on purpose, update $($env:PIN_FILE) in the same commit as the cert secret."
            exit 1
          }
          Write-Host "The exe is signed by the pinned certificate $pin"

      - name: Package the release zip
        shell: pwsh
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # A root folder inside the zip, so unpacking never scatters the app
          # over whatever directory the user happened to be in.
          $stage = "dist/stage/DeltaTor"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse "Windows/src/DeltaTor.App/bin/Release/net8.0-windows/*" $stage
          Copy-Item -Recurse "Windows/vendor" "$stage/vendor"
          Compress-Archive -Path "dist/stage/DeltaTor" -DestinationPath "dist/deltator-$($env:TAG_NAME)-windows-x64.zip" -Force
          Get-ChildItem dist/*.zip

      - name: Upload the release zip
        uses: actions/upload-artifact@v4
        with:
          name: deltator-release-windows
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/*.zip
          generate_release_notes: true
