name: Build Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Tor Expert Bundle (tor/lyrebird/geoip) plus Se7enTun (the WinTUN +
      # tun2socks engine) plus the fork's default torrc (torrc-windows from the
      # branch). The binaries are pinned and SHA-256 verified by the script; it
      # must run before dotnet publish, which copies them into the app output.
      - name: Fetch pinned binaries (Tor Expert Bundle 16.0.1 + Se7enTun + default torrc)
        run: ./Windows/fetch-binaries.ps1 -CI
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish (self-contained, so no .NET install is needed)
        run: >
          dotnet publish Windows/src/DeltaTor.App/DeltaTor.App.csproj
          -c Release -r win-x64 --self-contained true --nologo

      # The app is published self-contained: the .NET runtime must sit next to
      # DeltaTor.exe, because a user installs nothing. Se7enTun resolves its
      # data plane from <base dir>\Resources\tun2socks\ (at runtime the base dir
      # is the packaged data/ folder), never from its own folder, and
      # TorrcSettings reads the fetched default torrc from <base dir>\torrc-default.
      # A missing copy of any of these only surfaces at runtime on a user's
      # machine, so gate them here (the packaging step re-checks them in place).
      - name: Verify the self-contained output and the fetched data plane
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "Windows/src/DeltaTor.App/bin/Release/net8.0-windows10.0.19041.0/win-x64/publish"
          foreach ($f in @(
            "$out/DeltaTor.exe",
            "$out/DeltaTor.dll",
            "$out/DeltaTor.deps.json",
            "$out/DeltaTor.runtimeconfig.json",
            "$out/hostfxr.dll",
            "$out/hostpolicy.dll",
            "$out/coreclr.dll",
            "$out/System.Private.CoreLib.dll",
            "$out/System.Windows.Forms.dll",
            "$out/Se7enTun.dll",
            "$out/Resources/tun2socks/tun2socks.exe",
            "$out/Resources/tun2socks/wintun.dll",
            "$out/flags/de.png",
            "$out/torrc-default")) {
            if (-not (Test-Path $f)) { Write-Host "::error::missing $f"; exit 1 }
            Write-Host "ok $f"
          }
          if ((Get-Item "$out/torrc-default").Length -eq 0) {
            Write-Host "::error::$out/torrc-default is empty"
            exit 1
          }

      - name: Package the three artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null

          # 1. The portable app itself, in the layout a user unpacks. The exe
          #    and the whole self-contained .NET runtime it starts from (the
          #    apphost, the entry assembly, deps and runtime config, hostfxr /
          #    hostpolicy / coreclr and every framework assembly) MUST stay at
          #    the root: the host resolves them before any app code runs. Our
          #    own managed assemblies and all data files move under data/, where
          #    Program.PrepareAppDirectory points the app. Staged as a plain
          #    folder, NOT a zip: upload-artifact wraps everything in its own
          #    zip, so zipping here too would make users extract twice.
          $out = "Windows/src/DeltaTor.App/bin/Release/net8.0-windows10.0.19041.0/win-x64/publish"
          $stage = "dist/stage/deltator-debug-windows"
          $data = "$stage/data"
          New-Item -ItemType Directory -Force -Path $data | Out-Null

          # The runtime first: copy the whole publish output to the root, then
          # move our own files out of it into data/.
          Get-ChildItem -Force $out | ForEach-Object {
            Copy-Item -Recurse $_.FullName $stage
          }
          $moveToData = @(
            "DeltaTor.Core.dll", "DeltaTor.Native.dll", "Se7enTun.dll",
            "DeltaTor.Core.pdb", "DeltaTor.Native.pdb", "Se7enTun.pdb",
            "DeltaTor.ico", "torrc-default", "wintun.dll",
            "bridges", "geoip", "flags", "Resources")
          foreach ($name in $moveToData) {
            $src = Join-Path $stage $name
            if (Test-Path $src) { Move-Item -Force $src (Join-Path $data $name) }
          }
          Copy-Item -Recurse "Windows/vendor" "$data/vendor"

          # The runtime at the root and the app's own files under data/. The
          # layout is load-bearing: Program.PrepareAppDirectory reads the
          # assemblies and wintun.dll from data/, so silently shipping the old
          # shape would only fail on a user's machine.
          foreach ($f in @(
            "$stage/DeltaTor.exe",
            "$stage/DeltaTor.dll",
            "$stage/DeltaTor.deps.json",
            "$stage/DeltaTor.runtimeconfig.json",
            "$stage/hostfxr.dll",
            "$stage/hostpolicy.dll",
            "$stage/coreclr.dll",
            "$stage/System.Private.CoreLib.dll",
            "$stage/System.Windows.Forms.dll",
            "$data/DeltaTor.Core.dll",
            "$data/DeltaTor.Native.dll",
            "$data/Se7enTun.dll",
            "$data/wintun.dll",
            "$data/Resources/tun2socks/tun2socks.exe",
            "$data/Resources/tun2socks/wintun.dll",
            "$data/flags/de.png",
            "$data/torrc-default")) {
            if (-not (Test-Path $f)) { Write-Host "::error::missing $f"; exit 1 }
          }
          # Nothing app-specific may be left at the root: Program's resolver
          # expects the app assemblies under data/, and a leftover root copy
          # would shadow the shipped one on an in-place upgrade.
          $stray = @($moveToData | Where-Object { Test-Path (Join-Path $stage $_) })
          if ($stray.Count -gt 0) {
            Write-Host "::error::app files left at the root: $($stray -join ', ')"
            exit 1
          }

          # 2. The sources of the commit that was built, so the zip and the
          #    app cannot disagree about what "this build" was.
          git archive --format=zip --output="dist/src.zip" HEAD
          Expand-Archive "dist/src.zip" -DestinationPath "dist/stage/deltator-sources"
          Remove-Item "dist/src.zip"

          # 3. Managed PDBs: a stack trace from a crash is unreadable without
          #    them. (Se7enTun ships its own pdb in its release zip.)
          $sym = "dist/stage/deltator-native-symbols"
          New-Item -ItemType Directory -Force -Path $sym | Out-Null
          Get-ChildItem -Recurse "Windows/src" -Filter *.pdb -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $sym }

          Get-ChildItem -Recurse dist/stage | Select-Object -First 20

      - name: Upload the portable app
        uses: actions/upload-artifact@v4
        with:
          name: deltator-debug-windows
          path: dist/stage/deltator-debug-windows
          if-no-files-found: error

      - name: Upload the sources
        uses: actions/upload-artifact@v4
        with:
          name: deltator-sources
          path: dist/stage/deltator-sources
          if-no-files-found: error

      - name: Upload the native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: deltator-native-symbols
          path: dist/stage/deltator-native-symbols
          if-no-files-found: error
