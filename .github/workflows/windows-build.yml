name: Build Windows

on:
  push:
    branches: [ "main", "test" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fetch pinned official binaries (Tor Expert Bundle 15.0.24)
        run: ./Windows/fetch-binaries.ps1 -CI

      - name: Build
        run: dotnet build Windows/DeltaTor.sln -c Release --nologo

      - name: Package the build output
        shell: pwsh
        run: |
          $out = "deltator-windows-ci"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse "Windows/src/DeltaTor.App/bin/Release/net8.0-windows/*" $out
          Copy-Item -Recurse "Windows/vendor" "$out/vendor"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deltator-windows-ci
          path: deltator-windows-ci/
          if-no-files-found: error
