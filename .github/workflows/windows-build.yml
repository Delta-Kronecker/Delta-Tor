name: Build Windows

on:
  push:
    branches: [ "main", "test" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Stage 4: hev-socks5-tunnel.dll (tun2socks with the Wintun backend)
      # is built from the vendored source with the only Windows toolchain
      # upstream supports — MSYS2. Must run before dotnet build, which copies
      # the DLL next to DeltaTor.exe.
      - name: Set up MSYS2 (native tunnel toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: gcc make

      - name: Build hev-socks5-tunnel.dll
        shell: msys2 {0}
        run: ./Windows/native/build-hev.sh

      - name: Fetch pinned official binaries (Tor Expert Bundle 15.0.24)
        run: ./Windows/fetch-binaries.ps1 -CI

      - name: Build
        run: dotnet build Windows/DeltaTor.sln -c Release --nologo

      - name: Package the build output
        shell: pwsh
        run: |
          $out = "deltator-windows-ci"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse "Windows/src/DeltaTor.App/bin/Release/net8.0-windows/*" $out
          Copy-Item -Recurse "Windows/vendor" "$out/vendor"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deltator-windows-ci
          path: deltator-windows-ci/
          if-no-files-found: error
