name: Build Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Tor Expert Bundle (tor/lyrebird/geoip) plus Se7enTun (the WinTUN +
      # tun2socks engine) plus the fork's default torrc (torrc-windows from the
      # branch). The binaries are pinned and SHA-256 verified by the script; it
      # must run before dotnet build, which copies them into the app output.
      - name: Fetch pinned binaries (Tor Expert Bundle 16.0.1 + Se7enTun + default torrc)
        run: ./Windows/fetch-binaries.ps1 -CI
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build
        run: dotnet build Windows/DeltaTor.sln -c Release --nologo

      # Se7enTun resolves its data plane from <base dir>\Resources\tun2socks\
      # (at runtime the base dir is the packaged data/ folder), never from its
      # own folder, and TorrcSettings reads the fetched default torrc from
      # <base dir>\torrc-default. A missing copy of either only surfaces at
      # runtime on a user's machine, so gate their presence in the build output
      # here (the packaging step re-checks them after moving them to data/).
      - name: Verify the fetched data plane and default torrc are in the build output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "Windows/src/DeltaTor.App/bin/Release/net8.0-windows10.0.19041.0"
          foreach ($f in @(
            "$out/DeltaTor.exe",
            "$out/Se7enTun.dll",
            "$out/Resources/tun2socks/tun2socks.exe",
            "$out/Resources/tun2socks/wintun.dll",
            "$out/flags/de.png",
            "$out/torrc-default")) {
            if (-not (Test-Path $f)) { Write-Host "::error::missing $f"; exit 1 }
            Write-Host "ok $f"
          }
          if ((Get-Item "$out/torrc-default").Length -eq 0) {
            Write-Host "::error::$out/torrc-default is empty"
            exit 1
          }

      - name: Package the three artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null

          # 1. The portable app itself, in the layout a user unpacks: only
          #    DeltaTor.exe (plus the three files the .NET host reads before any
          #    app code runs — the managed entry assembly, deps and runtime
          #    config) at the root, everything else under data/. Staged as a
          #    plain folder, NOT a zip: upload-artifact wraps everything in its
          #    own zip, so zipping here too would make users extract twice (zip
          #    inside zip inside folder).
          $out = "Windows/src/DeltaTor.App/bin/Release/net8.0-windows10.0.19041.0"
          $stage = "dist/stage/deltator-debug-windows"
          $data = "$stage/data"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $rootFiles = @(
            "DeltaTor.exe", "DeltaTor.dll",
            "DeltaTor.deps.json", "DeltaTor.runtimeconfig.json")
          foreach ($f in $rootFiles) { Copy-Item "$out/$f" $stage }
          Get-ChildItem -Force $out | Where-Object { $_.Name -notin $rootFiles } |
            ForEach-Object { Copy-Item -Recurse $_.FullName $data }
          Copy-Item -Recurse "Windows/vendor" "$data/vendor"

          # The layout is load-bearing: Program.PrepareAppDirectory reads the
          # assemblies and wintun.dll from data/, so silently shipping the old
          # shape would only fail on a user's machine.
          foreach ($f in @(
            "$stage/DeltaTor.exe",
            "$stage/DeltaTor.dll",
            "$stage/DeltaTor.deps.json",
            "$stage/DeltaTor.runtimeconfig.json",
            "$data/DeltaTor.Core.dll",
            "$data/DeltaTor.Native.dll",
            "$data/Se7enTun.dll",
            "$data/wintun.dll",
            "$data/Resources/tun2socks/tun2socks.exe",
            "$data/Resources/tun2socks/wintun.dll",
            "$data/flags/de.png",
            "$data/torrc-default")) {
            if (-not (Test-Path $f)) { Write-Host "::error::missing $f"; exit 1 }
          }
          $stray = @(Get-ChildItem -Force $stage -File |
            Where-Object { $_.Name -notin $rootFiles })
          if ($stray.Count -gt 0) {
            Write-Host "::error::unexpected files at the root: $($stray.Name -join ', ')"
            exit 1
          }

          # 2. The sources of the commit that was built, so the zip and the
          #    app cannot disagree about what "this build" was.
          git archive --format=zip --output="dist/src.zip" HEAD
          Expand-Archive "dist/src.zip" -DestinationPath "dist/stage/deltator-sources"
          Remove-Item "dist/src.zip"

          # 3. Managed PDBs: a stack trace from a crash is unreadable without
          #    them. (Se7enTun ships its own pdb in its release zip.)
          $sym = "dist/stage/deltator-native-symbols"
          New-Item -ItemType Directory -Force -Path $sym | Out-Null
          Get-ChildItem -Recurse "Windows/src" -Filter *.pdb -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $sym }

          Get-ChildItem -Recurse dist/stage | Select-Object -First 20

      - name: Upload the portable app
        uses: actions/upload-artifact@v4
        with:
          name: deltator-debug-windows
          path: dist/stage/deltator-debug-windows
          if-no-files-found: error

      - name: Upload the sources
        uses: actions/upload-artifact@v4
        with:
          name: deltator-sources
          path: dist/stage/deltator-sources
          if-no-files-found: error

      - name: Upload the native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: deltator-native-symbols
          path: dist/stage/deltator-native-symbols
          if-no-files-found: error
