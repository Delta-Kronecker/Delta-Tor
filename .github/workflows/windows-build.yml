name: Build Windows

on:
  push:
    branches: [ "main", "test" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Tor Expert Bundle (tor/lyrebird/geoip) plus Se7enTun (the WinTUN +
      # tun2socks engine). Both are pinned and SHA-256 verified by the script;
      # it must run before dotnet build, which copies them into the app output.
      - name: Fetch pinned official binaries (Tor Expert Bundle 15.0.25 + Se7enTun)
        run: ./Windows/fetch-binaries.ps1 -CI

      - name: Build
        run: dotnet build Windows/DeltaTor.sln -c Release --nologo

      # Se7enTun resolves its data plane from <exe folder>\Resources\tun2socks\,
      # never from its own folder. A missing copy there only surfaces at the
      # first tunnel start on a user's machine, so gate it here instead.
      - name: Verify the Se7enTun data plane shipped next to the exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "Windows/src/DeltaTor.App/bin/Release/net8.0-windows10.0.19041.0"
          foreach ($f in @(
            "$out/DeltaTor.exe",
            "$out/Se7enTun.dll",
            "$out/Resources/tun2socks/tun2socks.exe",
            "$out/Resources/tun2socks/wintun.dll",
            "$out/flags/de.png")) {
            if (-not (Test-Path $f)) { Write-Host "::error::missing $f"; exit 1 }
            Write-Host "ok $f"
          }

      - name: Package the three artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null

          # 1. The portable app itself (exe + managed DLLs + the fetched vendor
          #    bundle), the same shape a user unpacks. Staged as a plain folder,
          #    NOT a zip: upload-artifact wraps everything in its own zip, so
          #    zipping here too would make users extract twice (zip inside zip
          #    inside folder).
          $stage = "dist/stage/deltator-debug-windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse "Windows/src/DeltaTor.App/bin/Release/net8.0-windows10.0.19041.0/*" $stage
          Copy-Item -Recurse "Windows/vendor" "$stage/vendor"

          # 2. The sources of the commit that was built, so the zip and the
          #    app cannot disagree about what "this build" was.
          git archive --format=zip --output="dist/src.zip" HEAD
          Expand-Archive "dist/src.zip" -DestinationPath "dist/stage/deltator-sources"
          Remove-Item "dist/src.zip"

          # 3. Managed PDBs: a stack trace from a crash is unreadable without
          #    them. (Se7enTun ships its own pdb in its release zip.)
          $sym = "dist/stage/deltator-native-symbols"
          New-Item -ItemType Directory -Force -Path $sym | Out-Null
          Get-ChildItem -Recurse "Windows/src" -Filter *.pdb -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $sym }

          Get-ChildItem -Recurse dist/stage | Select-Object -First 20

      - name: Upload the portable app
        uses: actions/upload-artifact@v4
        with:
          name: deltator-debug-windows
          path: dist/stage/deltator-debug-windows
          if-no-files-found: error

      - name: Upload the sources
        uses: actions/upload-artifact@v4
        with:
          name: deltator-sources
          path: dist/stage/deltator-sources
          if-no-files-found: error

      - name: Upload the native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: deltator-native-symbols
          path: dist/stage/deltator-native-symbols
          if-no-files-found: error
