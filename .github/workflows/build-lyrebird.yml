# Builds official lyrebird (Tor Project pluggable transport: obfs4 + webtunnel + snowflake)
# for Android, exactly how the APK ships it: a static, exec-able binary laid down as
# nativeLibraryDir/libobfs4proxy.so. Run on a Linux CI machine; the armv7 target needs
# the Android NDK (arm64 is cgo-free). See scripts/fetch-official-tor.ps1 for tor itself.
name: Build lyrebird (official)

on:
  workflow_dispatch:

jobs:
  build:
    name: lyrebird ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            goos: android
            goarch: arm64
            goarm: ""
            needs_cgo: false
          - abi: armeabi-v7a
            goos: android
            goarch: arm
            goarm: 7
            needs_cgo: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go 1.22.12
        uses: actions/setup-go@v5
        with:
          # Go 1.22 is the toolchain lyrebird pins; newer Go moved net.zoneCache and
          # the pinned wlynxg/anet v0.0.5 no longer links.
          go-version: "1.22.12"

      - name: Clone official lyrebird
        run: |
          git clone --depth 1 \
            https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/lyrebird.git lyrebird

      - name: Find NDK clang (armv7 cgo only)
        if: matrix.needs_cgo
        id: ndk
        run: |
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/*/toolchains/llvm/prebuilt/linux-x86_64 2>/dev/null | head -1 || echo $ANDROID_HOME/ndk-bundle)
          echo "cc=$(ls $NDK/bin/armv7a-linux-androideabi*-clang | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.abi }}
        env:
          CGO_ENABLED: ${{ matrix.needs_cgo && '1' || '0' }}
          CC: ${{ steps.ndk.outputs.cc }}
        run: |
          cd lyrebird
          export GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} CGO_ENABLED=$CGO_ENABLED
          go build -ldflags="-s -w" -o ../lyrebird-${{ matrix.abi }} ./cmd/lyrebird
          cd ..
          sha256sum lyrebird-${{ matrix.abi }}

      - name: Verify static binary
        run: |
          file lyrebird-${{ matrix.abi }} || true
          test -s lyrebird-${{ matrix.abi }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyrebird-${{ matrix.abi }}
          path: lyrebird-${{ matrix.abi }}
          retention-days: 14