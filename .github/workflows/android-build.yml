name: Build APK

on:
  push:
    branches: [ "main", "android" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform, build-tools and NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Make gradlew executable
        run: chmod +x Android/gradlew

      - name: Build debug APK
        run: ./Android/gradlew -p Android assembleDebug --no-daemon

      - name: Package the three artifacts
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/stage/apk dist/stage/symbols

          # zip is present on the runner images, but the packaging must not be
          # the reason a build fails, so fall back to the interpreter. The
          # output has to be absolute: zip runs inside the staged directory.
          pack() {
            if command -v zip >/dev/null 2>&1; then
              (cd "$1" && zip -qr "$2" .)
            else
              python3 -m zipfile -c "$2" "$1"
            fi
          }

          # 1. The APK itself.
          find Android/app/build/outputs/apk -name '*.apk' -exec cp {} dist/stage/apk/ \;
          pack dist/stage/apk "$PWD/dist/deltator-debug-apk.zip"

          # 2. The sources, from the commit that was built, so the zip and the
          #    APK cannot disagree about what "this build" was.
          git archive --format=zip --output=dist/deltator-sources.zip HEAD

          # 3. Unstripped native libraries. Tor, lyrebird and hev-socks5-tunnel
          #    are C, and a stack trace from a crash is unreadable without these.
          for dir in \
            Android/app/build/intermediates/merged_native_libs \
            Android/app/build/intermediates/cxx \
            Android/app/build/intermediates/staged_native_libs
          do
            if [ -d "$dir" ]; then
              find "$dir" -name '*.so' -exec cp --parents {} dist/stage/symbols/ \;
            fi
          done
          pack dist/stage/symbols "$PWD/dist/deltator-native-symbols.zip"

          ls -la dist/*.zip

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deltator-debug-apk
          path: dist/deltator-debug-apk.zip
          if-no-files-found: error

      - name: Upload the sources
        uses: actions/upload-artifact@v4
        with:
          name: deltator-sources
          path: dist/deltator-sources.zip
          if-no-files-found: error

      - name: Upload the native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: deltator-native-symbols
          path: dist/deltator-native-symbols.zip
          if-no-files-found: error