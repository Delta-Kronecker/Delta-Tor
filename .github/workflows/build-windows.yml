name: Build and Release for Windows

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build Windows Application
        run: wails build -platform windows/amd64 -o DeltaTor.exe

      - name: Create Release Directory
        run: |
          mkdir release-package
          copy build\bin\DeltaTor.exe release-package\
          copy README.md release-package\ 2>$null || echo "README.md not found, skipping..."
          copy LICENSE release-package\ 2>$null || echo "LICENSE not found, skipping..."

      - name: Zip Release Files
        run: |
          Compress-Archive -Path release-package\* -DestinationPath DeltaTor-windows.zip -Force

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Delta Tor ${{ inputs.tag_name }}
          draft: false
          prerelease: false
          files: DeltaTor-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
